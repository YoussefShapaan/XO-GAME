<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Pro</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">


  <!-- اختيار نوع اللعب -->
  <div class="modes">
    <button id="m2" onclick="setMode('multi')" class="active">
      لاعب ضد لاعب
    </button>

    <button id="mai" onclick="setMode('ai')">
      لاعب ضد الذكاء الاصطناعي
    </button>
  </div>

  <!-- حالة اللعبة -->
  <h2 id="status">دور اللاعب X</h2>

  <!-- لوحة اللعبة -->
  <div id="board" class="board"></div>

  <!-- النتائج -->
  <div class="scores">
    <div>X : <span id="sx">0</span></div>
    <div>O : <span id="so">0</span></div>
    <div>تعادل : <span id="sd">0</span></div>
  </div>

  <!-- التحكم -->
  <div class="controls">
    <button onclick="restart()">إعادة اللعب</button>
    <button onclick="resetScores()">تصفير النتائج</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
