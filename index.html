<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Pro</title>

  <link rel="stylesheet" href="style.css">
</head>
<body> 

<div class="container">

  <h1> X-O GAME </h1>
  <!-- Mode اللعب-->
  <div class="modes">
    <button id="m2" onclick="setMode('multi')" class="active">
      player vs player 
   </button>

    <button id="mai" onclick="setMode('ai')">
      Player vs. AI
    </button>
  </div>

  <!-- دور اللاعب -->
  <h2 id="status">Player X's turn</h2>

  <!-- board-->
  <div id="board" class="board"></div>

  <!-- scores -->
  <div class="scores">
    <div>X : <span id="sx">0</span></div>
    <div>O : <span id="so">0</span></div>
    <div>Draw : <span id="sd">0</span></div>
  </div>

  <!-- controls -->
  <div class="controls">
    <button onclick="restart()">Restart Game</button>
    <button onclick="resetScores()">Reset Scores</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
